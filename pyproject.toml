[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lino-autocare-copilot"
version = "0.1.0"
description = "A source-grounded retrieval and LLM portfolio project for an autocare business"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.40,<2",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
lino-search = "lino_autocare_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
